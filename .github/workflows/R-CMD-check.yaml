name: R-CMD-check
on:
  push:
    branches: [main, v0.2-rebuild]
  pull_request:
  workflow_dispatch:
jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install light dependencies
        run: Rscript -e 'install.packages(c("scico", "dplyr", "magrittr", "rlang", "ggplot2", "tibble", "forcats", "rcmdcheck", "testthat"))'
      - name: R CMD check
        run: Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual", "--no-vignettes"), error_on = "warning")'
